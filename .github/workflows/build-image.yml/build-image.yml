name: Build and publish image

# The image changes rarely (entrypoint / gate / base bumps only) — dsh
# updates flow through npm inside the app and never touch this pipeline.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/iconicfinesse/dsh-umbrel:latest
            ghcr.io/iconicfinesse/dsh-umbrel:sha-${{ github.sha }}
